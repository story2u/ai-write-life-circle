name: Probe edge to API (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/codex/ops-configure-deepseek-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRITER_AGENT_API_TOKEN: ${{ secrets.WRITER_AGENT_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read zone TLS settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import urllib.request, json, os
          base='https://api.cloudflare.com/client/v4'
          def get(path):
            req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
            try:
              with urllib.request.urlopen(req) as r: return json.load(r)
            except urllib.error.HTTPError as e: return {'status':e.code,'error':json.loads(e.read()).get('errors')}
          zones=get('/zones?name=story2u.xyz')
          if not zones.get('success'): print(zones); raise SystemExit(1)
          zone=zones['result'][0]['id']
          before=get('/zones/'+zone+'/settings/ssl')
          print('previous_tls_mode', before.get('result',{}).get('value'))
          req=urllib.request.Request(base+'/zones/'+zone+'/settings/ssl',method='PATCH',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'},data=json.dumps({'value':'strict'}).encode())
          try:
            with urllib.request.urlopen(req) as response: result=json.load(response)
            print('tls_update',json.dumps(result))
          except urllib.error.HTTPError as e:
            print('tls_update_failed',e.code,json.loads(e.read()).get('errors')); raise SystemExit(1)
          PYTHON
