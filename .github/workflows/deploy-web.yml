name: Restore Web version before Sprint 3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    if: github.ref == 'refs/heads/codex/restore-web-before-sprint3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g wrangler@4.151.0
      - name: Verify the unintended version is still active
        run: |
          wrangler deployments list --name story2u-web --json > /tmp/worker-history.json
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/worker-history.json','utf8')); if(!Array.isArray(h)) throw Error('Unknown deployment history shape'); const prior=h.find(d=>!d.versions?.some(v=>v.version_id==='ff529159-04ac-4370-9afc-babe9d054478')); if(!prior?.versions?.some(v=>v.version_id==='27d1302c-a582-4d0b-8376-65a665b88621')) throw Error('Prior active version differs; refusing rollback'); console.log('Previous deployment version verified')"
          wrangler deployments status --name story2u-web --json > /tmp/worker-before.json
          node -e "const s=require('fs').readFileSync('/tmp/worker-before.json','utf8'); if(!s.includes('ff529159-04ac-4370-9afc-babe9d054478')) throw Error('Active deployment changed; refusing rollback')"
      - name: Restore the previously deployed version
        run: wrangler rollback 27d1302c-a582-4d0b-8376-65a665b88621 --name story2u-web --message 'Restore pre-Sprint-3 version; PR9 was approved for merge only, not deployment'
      - name: Verify restored active version
        run: |
          wrangler deployments status --name story2u-web --json > /tmp/worker-after.json
          node -e "const s=require('fs').readFileSync('/tmp/worker-after.json','utf8'); if(!s.includes('27d1302c-a582-4d0b-8376-65a665b88621')) throw Error('Restore not confirmed'); console.log('Restored active version verified: 27d1302c-a582-4d0b-8376-65a665b88621')"
