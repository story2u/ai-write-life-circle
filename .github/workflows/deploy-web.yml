name: Diagnose API authentication (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/codex/ops-configure-deepseek-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare configured backend credentials without exposing values
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          WRITER_AGENT_API_TOKEN: ${{ secrets.WRITER_AGENT_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          hosts_file=$(mktemp)
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" > "$key_file"
          printf '%s\n' 'ec2-16-170-155-138.eu-north-1.compute.amazonaws.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEfvu4+N8AnA5tN9rVPW0IJ7ueagH6Z8hS9onER7qfEU' > "$hosts_file"
          python3 - <<'PYTHON'
          import os,urllib.request,urllib.error
          request=urllib.request.Request('https://api.story2u.xyz/v1/projects/local/workspace',headers={'Authorization':'Bearer '+os.environ['WRITER_AGENT_API_TOKEN']})
          try:
              with urllib.request.urlopen(request,timeout=20) as response: print('GitHub secret authenticated API status:',response.status)
          except urllib.error.HTTPError as error: print('GitHub secret authenticated API status:',error.code)
          PYTHON
          python3 -c 'import os;print(os.environ["WRITER_AGENT_API_TOKEN"],end="")' | ssh -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" ubuntu@ec2-16-170-155-138.eu-north-1.compute.amazonaws.com 'sudo python3 -c '''import sys,hmac;from pathlib import Path;print("GitHub and server token match:",hmac.compare_digest(sys.stdin.read().strip(),Path("/etc/writer-agent/auth-token").read_text().strip()))''''
