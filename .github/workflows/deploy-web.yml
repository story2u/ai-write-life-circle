name: Probe edge to API (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/codex/ops-configure-deepseek-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRITER_AGENT_API_TOKEN: ${{ secrets.WRITER_AGENT_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read zone TLS settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import urllib.request, json, os
          base='https://api.cloudflare.com/client/v4'
          def get(path):
            req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
            try:
              with urllib.request.urlopen(req) as r: return json.load(r)
            except urllib.error.HTTPError as e: return {'status':e.code,'error':json.loads(e.read()).get('errors')}
          zones=get('/zones?name=story2u.xyz')
          if not zones.get('success'): print(zones); raise SystemExit(1)
          zone=zones['result'][0]['id']
          print('tls_mode',get('/zones/'+zone+'/settings/ssl').get('result',{}).get('value'))
          print('worker_routes',json.dumps(get('/zones/'+zone+'/workers/routes').get('result')))
          for url in ['https://www.story2u.xyz','https://story2u.xyz','https://api.story2u.xyz/health','https://www.story2u.xyz/v1/projects/local/workspace']:
            try:
              with urllib.request.urlopen(url,timeout=15) as response: print('public_status',url,response.status)
            except urllib.error.HTTPError as e: print('public_status',url,e.code)
            except Exception as e: print('public_error',url,type(e).__name__)
          PYTHON
