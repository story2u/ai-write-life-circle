name: Probe edge to API (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/codex/ops-configure-deepseek-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRITER_AGENT_API_TOKEN: ${{ secrets.WRITER_AGENT_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Protected temporary edge probe
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          probe_root=$(mktemp -d)
          cd "$probe_root"
          trap 'npx --yes wrangler@4.151.1 delete --name story2u-auth-probe --force >/dev/null 2>&1 || true; rm -rf "$probe_root"' EXIT
          cat > wrangler.toml <<'CONFIG'
          name = "story2u-auth-probe"
          main = "probe.js"
          compatibility_date = "2026-10-17"
          workers_dev = true
          CONFIG
          cat > probe.js <<'JS'
          export default { async fetch(request,env) {
            if(request.headers.get('Authorization') !== 'Bearer '+env.PROBE_TOKEN) return Response.json({probeRecognized:true,credentialPresent:!!request.headers.get('Authorization'),tokenConfigured:typeof env.PROBE_TOKEN,tokenLength:env.PROBE_TOKEN?.length},{status:404});
            const result=[];
            for (const userAgent of [null,'WriterAgent-API-Check']) {
              const headers=new Headers({authorization:'Bearer '+env.WRITER_AGENT_API_TOKEN}); if(userAgent) headers.set('user-agent',userAgent);
              const response=await fetch('https://api.story2u.xyz/v1/projects/local/workspace',{headers,redirect:'manual'});
              const text=await response.text();let code;try{code=JSON.parse(text).code}catch{}
              const location=response.headers.get('location');
              result.push({status:response.status,server:response.headers.get('server'),via:response.headers.get('via'),contentType:response.headers.get('content-type'),location:location?new URL(location).origin:null,code:typeof code==='string'&&/^[A-Z_]+$/.test(code)?code:null,userAgent:!!userAgent});
            }
            return Response.json(result,{headers:{'cache-control':'no-store'}});
          }};
          JS
          python3 - <<'PYTHON'
          import secrets,json,os
          from pathlib import Path
          probe=secrets.token_hex(32)
          Path('runtime-secrets.json').write_text(json.dumps({'WRITER_AGENT_API_TOKEN':os.environ['WRITER_AGENT_API_TOKEN'],'PROBE_TOKEN':probe}))
          Path('probe.curl').write_text('header = "Authorization: Bearer '+probe+'"\n')
          PYTHON
          npx --yes wrangler@4.151.1 deploy --secrets-file runtime-secrets.json
          curl -fsS --retry 10 --retry-all-errors --retry-delay 3 --config probe.curl https://story2u-auth-probe.bluedao10000.workers.dev
