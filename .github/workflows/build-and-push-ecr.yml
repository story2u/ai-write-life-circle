name: Build and Push to AWS ECR

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deploy/Dockerfile.web'
      - '.github/workflows/build-and-push-ecr.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write
  contents: read

env:
  REGISTRY_ALIAS: greenfield-adventures

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build and Push Docker Image
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: greenfield-web
          IMAGE_TAG: ${{ github.sha }}
          LATEST_TAG: latest
        run: |
          # Build and push with multiple tags
          docker buildx build \
            --push \
            --file deploy/Dockerfile.web \
            --tag $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            --tag $REGISTRY/$REPOSITORY:$LATEST_TAG \
            --tag $REGISTRY/$REPOSITORY:${{ github.ref_name }} \
            .
          
          echo "IMAGE_URI=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Output image URI
        run: |
          echo "✓ Docker image pushed to ECR"
          echo "Image URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }}"

  notify:
    runs-on: ubuntu-latest
    needs: build-and-push
    name: Notify Deployment
    if: success()
    
    steps:
      - name: Create deployment notification
        run: |
          echo "✓ Docker image is ready for deployment"
          echo "Image: ${{ needs.build-and-push.outputs.image_uri }}"
          echo ""
          echo "To deploy to EC2, run:"
          echo "  ssh ubuntu@EC2_IP"
          echo "  cd ~/greenfield-adventures"
          echo "  ./deploy-ec2.sh pull-image $IMAGE_URI"
