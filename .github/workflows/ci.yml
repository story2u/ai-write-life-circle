name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Typecheck, Lint & Test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @writer-agent/contracts build

      - name: OpenAPI reproducibility
        run: pnpm openapi:check

      - name: OpenAPI validation
        run: pnpm openapi:lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build (smoke check)
        run: pnpm build

      - name: Harness projection and ID checks
        run: |
          pnpm harness:rebuild
          node scripts/check-knowledge-ids.mjs --fail

      - name: Built API smoke and production identity guard
        run: node scripts/smoke-built-api.mjs

      - name: Install Chromium
        run: pnpm --filter @writer-agent/web exec playwright install --with-deps chromium

      - name: Visual and API end-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writer-agent-vnext-verification
          path: |
            apps/web/test-results/
            apps/web/test-results-api/
          retention-days: 14
