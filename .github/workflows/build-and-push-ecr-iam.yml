name: Build and Push to AWS ECR (IAM User)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deploy/Dockerfile.web'
      - '.github/workflows/build-and-push-ecr-iam.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: greenfield-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build and Push Docker Image
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          LATEST_TAG: latest
        run: |
          # Build and push with multiple tags
          docker buildx build \
            --push \
            --file deploy/Dockerfile.web \
            --tag $REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            --tag $REGISTRY/${{ env.ECR_REPOSITORY }}:$LATEST_TAG \
            --tag $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }} \
            .
          
          echo "image_uri=$REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
          echo "repository=${{ env.ECR_REPOSITORY }}" >> $GITHUB_OUTPUT

      - name: Output image URI
        run: |
          echo "✓ Docker image pushed to ECR"
          echo "Image URI: ${{ steps.build-image.outputs.image_uri }}"
          echo "Registry: ${{ steps.build-image.outputs.registry }}"
          echo "Repository: ${{ steps.build-image.outputs.repository }}"

  notify:
    runs-on: ubuntu-latest
    needs: build-and-push
    name: Notify Deployment
    if: success()
    
    steps:
      - name: Create deployment notification
        run: |
          echo "✅ Docker image is ready for deployment"
          echo ""
          echo "📦 Image Details:"
          echo "  Registry: ${{ needs.build-and-push.outputs.registry }}"
          echo "  Repository: ${{ needs.build-and-push.outputs.repository }}"
          echo "  Tag: ${{ github.sha }}"
          echo ""
          echo "🚀 To deploy to EC2:"
          echo "  ssh ubuntu@YOUR_EC2_IP"
          echo "  cd ~/greenfield-adventures"
          echo "  ./deploy/deploy-simple.sh"
