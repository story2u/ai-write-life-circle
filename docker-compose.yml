version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: greenfield-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greenfield-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: greenfield-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - VITE_WRITER_AGENT_MODE=${WRITER_AGENT_MODE:-demo}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - greenfield-net
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  greenfield-net:
    driver: bridge
